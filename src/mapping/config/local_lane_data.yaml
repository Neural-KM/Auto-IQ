# Local Lane Data Generator Configuration
# =====================================
# These parameters define lane structure for the mapping package.
# Used by LocalLaneEstimator to compute lane centerlines from detected boundaries.

# Road geometry — current hardware test track is a 2-lane road.
lane_count: 2                   # Number of lanes to divide road into
total_road_width: 7.0           # Expected total road width (meters), ~3.5 m per lane

# Drivable-to-lane buffer distances (meters)
# The extracted boundary is the OUTER edge of the drivable area (road + road_line).
# The actual lane boundaries are INSIDE this - there's buffer area (shoulder, etc.)
# between the drivable edge and the first/last lane boundary.
#
# Right side (wall/kerb): drivable edge -> rightmost lane boundary
# Left side (divider): drivable edge -> leftmost lane boundary
clearance_from_wall: 0.3        # Buffer from right drivable edge to rightmost lane (meters)
clearance_from_divider: 0.3     # Buffer from left drivable edge to leftmost lane (meters)

# Validation thresholds — relaxed for the narrower 2-lane road.
min_road_width: 4.5             # Minimum valid road width (meters)
max_road_width: 12.0            # Maximum valid road width (meters)

# BEV (Bird's Eye View) transform parameters
# Range should cover full camera FOV. For ~90° FOV camera:
# - Lateral at distance d: ±d * tan(45°) ≈ ±d
# - So at 50m forward, need ~±50m lateral
bev_x_range: [3.0, 60.0]        # Forward range for BEV transform (meters)
bev_y_range: [-50.0, 50.0]      # Lateral range for BEV transform (meters)
pixels_per_meter: 8.0           # BEV resolution (reduced for larger coverage)
