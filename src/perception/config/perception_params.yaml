/**:
  ros__parameters:
    # Perception Mode
    use_ground_truth: false
    perception_method: 1  # 0=Depth Map, 1=Frustum Filtering
    
    # Object Detection
    enable_object_detection: true
    model_path: 'yolov8n.pt'
    conf_threshold: 0.5
    obstacle_radius: 50.0
    
    # Lane Detection
    enable_lane_detection: true
    
    # Debug
    enable_debug_viz: false
    
    # TF Frame Names (must match bridge output)
    camera_frame: 'ego_vehicle/sensor/camera/rgb/front'
    lidar_frame: 'ego_vehicle/sensor/lidar/top'
    
    # Hood Mask (to ignore ego vehicle hood in detections)
    hood_mask:
      enabled: true
      top_y: 0.85
      top_left_x: 0.25
      top_right_x: 0.75
      bottom_y: 1.0
      bottom_left_x: 0.08
      bottom_right_x: 0.92
