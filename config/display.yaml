# Display Layout Configuration
# =============================
# Defines slot mappings for different visualization layouts.
# Each layout type has multiple options that can be selected.

# Available data sources:
#   Sensors (from sensors.yaml):
#     - 3rd_person, front_rgb, semantic, depth, lidar
#   Perception outputs (when using real perception):
#     - yolo_detections: RGB image with YOLO bounding boxes drawn
#     - yolo_input: Masked image fed to YOLO (with hood region blacked out)

# Slot names per layout (hardcoded in tiled_display.py):
#   default:    main, side_0, side_1, side_2
#   dual:       left, right
#   grid:       slot_0, slot_1, slot_2, slot_3, slot_4, slot_5 (3 cols)
#   fullscreen: main

# ============================================================================
# DEFAULT LAYOUT: 1 main panel + 3 side panels + bottom bar
# ============================================================================
default:
  options:
    # For fake perception (ground truth)
    fake_perception:
      slot_mapping:
        main: 3rd_person
        side_0: front_rgb
        side_1: semantic
        side_2: depth
    
    # For real perception with YOLO
    real_perception:
      slot_mapping:
        main: yolo_detections
        side_0: front_rgb
        side_1: yolo_input
        side_2: depth
    
    # All cameras view
    cameras:
      slot_mapping:
        main: 3rd_person
        side_0: front_rgb
        side_1: semantic
        side_2: depth

# ============================================================================
# DUAL LAYOUT: 2 panels side by side + bottom bar
# ============================================================================
dual:
  options:
    # Camera + LiDAR
    lidar:
      slot_mapping:
        left: 3rd_person
        right: lidar
    
    # RGB + YOLO detections
    yolo:
      slot_mapping:
        left: front_rgb
        right: yolo_detections
    
    # RGB + Depth
    depth:
      slot_mapping:
        left: front_rgb
        right: depth
    
    # RGB + Semantic
    semantic:
      slot_mapping:
        left: front_rgb
        right: semantic

# ============================================================================
# GRID LAYOUT: 2x3 grid of panels + bottom bar
# ============================================================================
grid:
  options:
    # All sensors
    all_sensors:
      slot_mapping:
        slot_0: 3rd_person
        slot_1: front_rgb
        slot_2: semantic
        slot_3: depth
        slot_4: lidar
        slot_5: yolo_detections
    
    # Cameras only (no lidar)
    cameras_only:
      slot_mapping:
        slot_0: 3rd_person
        slot_1: front_rgb
        slot_2: semantic
        slot_3: depth
        slot_4: yolo_detections
        slot_5: yolo_input

# ============================================================================
# FULLSCREEN LAYOUT: Single large panel + bottom bar
# ============================================================================
fullscreen:
  options:
    # 3rd person view
    third_person:
      slot_mapping:
        main: 3rd_person
    
    # Front RGB camera
    front_rgb:
      slot_mapping:
        main: front_rgb
    
    # YOLO detections
    yolo:
      slot_mapping:
        main: yolo_detections
    
    # Semantic segmentation
    semantic:
      slot_mapping:
        main: semantic
    
    # Depth camera
    depth:
      slot_mapping:
        main: depth
    
    # LiDAR BEV
    lidar:
      slot_mapping:
        main: lidar
