# Perception Configuration
# ========================

# Lane detection
enable_lane_detection: true

# Object detector settings (used when --fake-perception is NOT passed)
object_detector:
  model_path: 'yolov8n.pt'  # YOLO model: yolov8n.pt (fast), yolov8s.pt (balanced), yolov8m.pt (accurate)
  conf_threshold: 0.5  # Detection confidence threshold (0.0 - 1.0)

# Detection radius (meters)
obstacle_radius: 50.0

# Ego vehicle filtering
# Detections in the bottom portion of the image are filtered to avoid detecting the ego vehicle's hood/bumper.
# Adjust these values based on your camera placement (height, pitch, position).
ego_filter:
  # Ignore detections where bounding box bottom is below this percentage of image height (0.0 - 1.0)
  bottom_cutoff: 0.85
  # Only filter if bounding box top is also below this percentage (to avoid filtering tall objects)
  top_threshold: 0.70
