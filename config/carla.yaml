# ==========================================================================
# CARLA Configuration
# ==========================================================================
# Connection, simulation, and vehicle settings for CARLA simulator.

# ==========================================================================
# Connection
# ==========================================================================
connection:
  host: '127.0.0.1'
  port: 2000
  timeout: 10.0  # seconds

# ==========================================================================
# Simulation
# ==========================================================================
simulation:
  sync_mode: true
  fixed_delta_seconds: 0.05  # 20 FPS simulation (1/20 = 0.05)

# ==========================================================================
# Vehicle
# ==========================================================================
vehicle:
  filter: 'vehicle.tesla.model3'
