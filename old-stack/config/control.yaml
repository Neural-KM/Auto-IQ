# ==========================================================================
# AutoIQ Control Parameters
# ==========================================================================
# Tunable parameters for vehicle control. Edit this file to tune behavior.

# ==========================================================================
# Lateral Control (Steering)
# ==========================================================================
lateral:
  max_steering: 1.0
  max_steering_diff: 0.1  # Max change per step (smoothing)

# ==========================================================================
# Longitudinal Control (Speed)
# ==========================================================================
longitudinal:
  kp: 0.2
  ki: 0.2
  kd: 0.0
  max_throttle: 0.75
  max_brake: 0.5

# ==========================================================================
# Planning
# ==========================================================================
planning:
  target_speed: 30.0  # km/h
  lookahead_distance: 5.0  # meters
  waypoint_spacing: 2.0  # meters between waypoints

# ==========================================================================
# Obstacle Avoidance
# ==========================================================================
obstacle:
  detection_distance: 30.0  # meters
  lane_change_trigger_distance: 20.0  # meters
  safe_lane_change_gap: 10.0  # meters
